
name: Build Sample Flip VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure VST3
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build VST3
        run: >
          cmake --build build
          --config Release
          --target SampleFlip_VST3
          --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SampleFlip-Windows-VST3
          path: build/SampleFlip_artefacts/Release/VST3/
          if-no-files-found: error
